name: Commit Lint

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review, edited ]

# Reads the title from the event payload: no token permission needed.
permissions: {}

# Lints only the PR title, not every individual commit: PRs are squash-merged,
# so the PR title becomes the commit message on main that release-please reads.
# Local commits can be as messy as you want.
jobs:
  commitlint:
    runs-on: ubuntu-latest
    # Skip drafts and PRs opened by automation (release-please, dependabot, ...).
    if: >-
      github.event.pull_request.draft != true &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'dependabot[bot]'
    steps:
      - name: Validate PR title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .{1,100}$'

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title does not follow Conventional Commits: \"$PR_TITLE\""
            echo "Expected format: <type>(<optional scope>)<!>: <subject>"
            echo "  type: feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert"
            echo "  example: feat(auth): add the login form"
            exit 1
          fi
