name: release-please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

# Not skipped for bot pushes: it has to react to the merge of its own release PR to tag and publish the release.
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
