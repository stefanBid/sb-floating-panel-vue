name: release-please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

# Not skipped for bot pushes: it has to react to the merge of its own release PR to tag and publish the release.
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes to npm only when the merge of the release PR has just created a release. It lives here and not in a
  # workflow on `release: published`: a release created with GITHUB_TOKEN does not trigger other workflows.
  # npm Trusted Publishing (OIDC): no npm token in the repo; npm checks that the package is published by this
  # workflow of this repo, and adds the provenance attestation by itself.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # No dependency cache in a release workflow: a poisoned cache entry would end up in the published package.
      # Node from .nvmrc: its bundled npm (>= 11.5.1) supports Trusted Publishing.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # `prepublishOnly` builds dist/ right before packing, so the package never ships a stale build.
      - name: Publish to npm
        run: npm publish
